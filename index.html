<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawan Online Center - All India Online Service</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2, #ff758c, #ff7eb3);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .form-header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .form-header h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .form-header p {
            font-size: 13px;
            opacity: 0.9;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
        }

        .tab-buttons {
            display: flex;
            background: #f0f2f5;
            padding: 6px;
            margin: 15px 20px 0 20px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .form-body {
            padding: 25px 30px 30px 30px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
            font-size: 13px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #764ba2;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #5a6fd6, #683d94);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer-note span {
            color: #ff416c;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        .
        <div class="form-header">
            <h2>Pawan Online Center</h2>
            <p><i class="fa-solid fa-bolt"></i> All India Online Service Available</p>
        </div>

        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">लॉगिन (Login)</button>
            <button class="tab-btn" onclick="switchTab('register')">रजिस्टर (Register)</button>
        </div>

        <div class="form-body">
            <!-- Login Form -->
            <form id="login-form" class="form-section active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>मोबाइल नंबर या ईमेल</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="अपना रजिस्टर्ड नंबर दर्ज करें" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>पासवर्ड</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="अपना पासवर्ड दर्ज करें" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-right-to-bracket"></i> लॉगिन करें</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="form-section" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>पूरा नाम (Full Name)</label>
                    <div class="input-box">
                        <i class="fa-solid id-card"></i>
                        <input type="text" placeholder="अपना पूरा नाम दर्ज करें" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर (WhatsApp Number)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>ईमेल आईडी</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="email@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>पासवर्ड बनाएं</label>
                    <div class="input-box">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" placeholder="मजबूत पासवर्ड बनाएं" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-user-plus"></i> रजिस्टर करें</button>
            </form>

            <div class="footer-note">
                Contact Admin: <span>+91 7052724014</span>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                buttons[1].classList.add('active');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            alert('लॉगिन सफल रहा! (Pawan Online Center)');
        }

        function handleRegister(event) {
            event.preventDefault();
            alert('रजिस्ट्रेशन सफल रहा! आपकी आईडी क्रिएट हो गई है।');
        }
    </script>

</body>
</html>
